<ion-button
  [fill]="
    variant === 'primary' || variant === 'danger'
      ? 'solid'
      : variant === 'outline' || variant === 'danger-outline'
        ? 'clear'
        : variant === 'muted'
          ? 'solid'
          : 'clear'
  "
  [disabled]="disabled || loading"
  [attr.aria-busy]="loading"
  (click)="handleClick($event)"
  class="app-btn app-btn--{{ variant }} app-btn--{{ size }}"
>
  <ion-spinner *ngIf="loading" name="crescent" slot="start"></ion-spinner>
  <ion-icon
    *ngIf="icon && iconPosition === 'start' && !loading"
    [name]="icon"
    slot="start"
  ></ion-icon>
  {{ loading ? loadingLabel : label }}
  <ion-icon
    *ngIf="icon && iconPosition === 'end' && !loading"
    [name]="icon"
    slot="end"
  ></ion-icon>
</ion-button>
