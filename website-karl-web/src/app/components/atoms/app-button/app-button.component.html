<ion-button
  [fill]="
    variant === 'primary' || variant === 'danger'
      ? 'solid'
      : variant === 'outline' || variant === 'danger-outline'
        ? 'clear'
        : variant === 'muted'
          ? 'solid'
          : 'clear'
  "
  [disabled]="disabled"
  (click)="handleClick($event)"
  class="app-btn app-btn--{{ variant }} app-btn--{{ size }}"
>
  <ion-icon
    *ngIf="icon && iconPosition === 'start'"
    [name]="icon"
    slot="start"
  ></ion-icon>
  {{ label }}
  <ion-icon
    *ngIf="icon && iconPosition === 'end'"
    [name]="icon"
    slot="end"
  ></ion-icon>
</ion-button>
