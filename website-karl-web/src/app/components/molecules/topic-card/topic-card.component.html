<div class="topic-card">
  <div class="topic-header">
    <div class="topic-number">
      <span>TOPIC {{ index + 1 }}</span>
    </div>
  </div>

  <div class="topic-content">
    <h3 class="topic-title">{{ topic.title }}</h3>
    <section class="topic-description-panel" aria-label="Topic description">
      <span class="topic-description-label">Topic description</span>
      <p class="topic-description-text">
        {{
          topic.notes ||
            "Master the fundamentals of this topic to progress further."
        }}
      </p>
    </section>
  </div>

  <div class="topic-footer">
    <app-button
      class="topic-action"
      label="Start Learning"
      variant="primary"
      icon="arrow-forward-outline"
      (clicked)="goToTopic()"
    ></app-button>
  </div>
</div>
