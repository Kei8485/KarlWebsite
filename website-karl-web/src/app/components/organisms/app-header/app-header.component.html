<ion-header class="ion-no-border">
  <ion-toolbar class="header-toolbar">
    <div class="nav-container">
      <!-- 1. Brand & Logo -->
      <div class="nav-brand">
        <div class="logo-icon">
          <ion-icon name="construct-outline"></ion-icon>
        </div>
        <div class="brand-text">
          <span class="brand-title">ApexEng</span>
          <span class="brand-subtitle">APEX ENGINEERING</span>
        </div>
      </div>

      <!-- 🚨 HAMBURGER BUTTON (Mobile Only) -->
      <button class="mobile-menu-btn" (click)="toggleMenu()">
        <!-- Switches to an 'X' when open! -->
        <ion-icon
          [name]="isMobileMenuOpen ? 'close-outline' : 'menu-outline'"
        ></ion-icon>
      </button>

      <!-- 2. Desktop Links (🚨 Added 'desktop-only') -->
      <div class="nav-links desktop-only">
        <app-button
          label="Subjects"
          [variant]="
            currentUrl.includes('/subjects') ? 'primary' : 'transparent'
          "
          [disabled]="currentUrl.includes('/subjects')"
          routerLink="/subjects"
        ></app-button>

        <app-button
          label="Planner"
          [variant]="
            currentUrl.includes('/planner') ? 'primary' : 'transparent'
          "
          [disabled]="currentUrl.includes('/planner')"
          routerLink="/planner"
        ></app-button>
      </div>

      <!-- 3. Desktop User Profile (🚨 Added 'desktop-only') -->
      <div class="user-profile desktop-only" routerLink="/profile">
        <app-button
          *ngIf="currentUserRole === 'admin'"
          label="ADMIN: Manage Users"
          [variant]="
            currentUrl.includes('/manage-users') ? 'primary' : 'outline'
          "
          [disabled]="currentUrl.includes('/manage-users')"
          routerLink="/manage-users"
        ></app-button>
        <ion-icon
          name="person-circle-outline"
          class="user-profile-icon"
        ></ion-icon>
        <span class="user-profile-name"> {{ currentUserName }}</span>
      </div>
    </div>
  </ion-toolbar>

  <!-- 🚨 MOBILE DROPDOWN MENU -->
  <div class="mobile-menu" *ngIf="isMobileMenuOpen">
    <div class="mobile-nav-links">
      <app-button
        label="Subjects"
        [variant]="currentUrl.includes('/subjects') ? 'primary' : 'transparent'"
        routerLink="/subjects"
      ></app-button>
      <app-button
        label="Planner"
        [variant]="currentUrl.includes('/planner') ? 'primary' : 'transparent'"
        routerLink="/planner"
      ></app-button>

      <!-- Only Admins see this button in the mobile dropdown! -->
      <app-button
        *ngIf="currentUserRole === 'admin'"
        label="Manage Users"
        [variant]="currentUrl.includes('/manage-users') ? 'primary' : 'outline'"
        routerLink="/manage-users"
      ></app-button>
    </div>

    <div class="mobile-user-profile" routerLink="/profile">
      <ion-icon name="person-circle-outline"></ion-icon>
      <span>{{ currentUserName }}</span>
    </div>
  </div>
</ion-header>
