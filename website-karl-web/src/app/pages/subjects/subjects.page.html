<ion-header class="ion-no-border">
  <ion-toolbar class="header-toolbar">
    <div class="nav-container">
      <!-- 1. Brand & Logo -->
      <div class="nav-brand">
        <div class="logo-icon">
          <!-- Using a placeholder icon, you can swap with a custom SVG later! -->
          <ion-icon name="construct-outline"></ion-icon>
        </div>
        <div class="brand-text">
          <span class="brand-title">ApexEng</span>
          <span class="brand-subtitle">APEX ENGINEERING</span>
        </div>
      </div>

      <!-- 2. Navigation Links -->
      <div class="nav-links">
        <app-button
          label="Subjects"
          [variant]="router.url.includes('/subjects') ? 'primary' : 'transparent'"
          [disabled]="router.url.includes('/subjects')"
          routerLink="/subjects"
        ></app-button>

        <app-button
          label="Planner"
          [variant]="router.url.includes('/planner') ? 'primary' : 'transparent'"
          [disabled]="router.url.includes('/planner')"
          routerLink="/planner"
        ></app-button>
      </div>

      <!-- 3. User Profile (far right) -->
      <div class="user-profile" routerLink="/profile">
        <ion-icon
          name="person-circle-outline"
          class="user-profile-icon"
        ></ion-icon>
        <span class="user-profile-name"> {{currentUserName }}</span>
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="subjects-container">
    <p class="text-body">Catalogue</p>
    <h1 class="text-h1" style="color: var(--primary-foreground)">
      Select a Subject
    </h1>
    <p class="text-muted">Choose a module to continue your engineering path.</p>

    <!-- We will build the subject cards here next! -->

    <!-- Grid Layout to hold our cards -->
    <!-- 2x2 Grid Layout -->
    <ion-grid style="margin-top: 40px; padding: 0">
      <ion-row>
        <!-- Card 1 (Differential Calculus) -->
        <!-- The *ngFor loop creates one card for every subject in your database! -->
        <ion-col size="12" size-md="6" *ngFor="let subject of databaseSubjects">
          <app-card>
            <!-- Category Tag -->
            <span class="subject-tag">Mathematics</span>

            <!-- The Title Trick: We use .split('-') to chop your title in half! -->
            <h2 class="subject-title">
              <span class="code-accent">{{ subject.title.split('-')[0] }}</span>
              <span class="code-divider">•</span>
              {{ subject.title.split('-')[1] }}
            </h2>

            <!-- The Dynamic Description -->
            <p class="subject-desc">{{ subject.description }}</p>

            <!-- Footer with Dynamic Topic Count! -->
            <div class="subject-footer">
              <span class="meta-text">{{ subject.topics.length }} topics</span>
              <app-button
                variant="primary"
                label="Open topic tree"
              ></app-button>
            </div>
          </app-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
