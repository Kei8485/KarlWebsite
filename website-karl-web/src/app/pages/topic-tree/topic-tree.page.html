<ion-content class="ion-padding">
  <div class="page-container">
    <!-- Modern Hero Section (Only shows when data loads) -->
    <div class="subject-hero" *ngIf="subjectData">
      <div class="breadcrumb">
        <span>SUBJECT JOURNEY</span>
      </div>

      <!-- Uses your awesome split trick for a 2-tone title! -->
      <h1 class="page-title">
        <span class="accent-code">{{ subjectData.title.split('-')[0] }}</span>
        <span class="divider">/</span>
        {{ subjectData.title.split('-')[1] }}
      </h1>

      <!-- Glassmorphism Description Card -->
      <div class="desc-card">
        <div class="glow-bar"></div>
        <p>{{ subjectData.description }}</p>
      </div>
    </div>

    <!-- Loading Spinner -->
    <div *ngIf="isLoading" class="loading-state">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Loading module data...</p>
    </div>

    <!-- Empty State (if no topics in DB) -->
    <div *ngIf="!isLoading && topics.length === 0" class="empty-state">
      <p>No topics have been added to this subject yet!</p>
    </div>

    <!-- The actual list of Topic Cards -->
    <div class="topics-grid" *ngIf="topics.length > 0">
      <app-topic-card
        *ngFor="let topic of topics; let i = index"
        [topic]="topic"
        [index]="i"
      >
      </app-topic-card>
    </div>
  </div>
</ion-content>
